name = "mimonik"
compatibility_date = "2026-04-24"
compatibility_flags = ["nodejs_compat"]
main = "src/worker.js"

# Preview URL větví: https://<alias>-mimonik.knyttl.workers.dev
workers_dev = true
preview_urls = true

# Produkce + preview větví: https://<větev>.mimonik.knyt.tl (wrangler preview)
routes = [
  { pattern = "mimonik.knyt.tl", custom_domain = true, previews_enabled = true }
]

[observability]
enabled = true

[assets]
directory = "html"
binding = "ASSETS"
run_worker_first = ["/api/*"]

# Odběry upozornění (KV se při nasazení vytvoří automaticky, pokud ho wrangler umí zřídit)
[[kv_namespaces]]
binding = "SUBS"

# Veřejný VAPID klíč; privátní (VAPID_PRIVATE_JWK) a NOTIFY_TOKEN jsou secrets
[vars]
VAPID_PUBLIC = "BOuwUg6iOI2A8OS4xwds-TtBWtyH9TX8_ee-hjBiEmZxoe5MLyaTQp71dz80NBdxXxpaF5GunC2uEck3bv1qMZc"

# Preview větví (wrangler preview); nastavení se dědí z hlavní konfigurace
[previews]
