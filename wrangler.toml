name = "mimonik"
compatibility_date = "2026-04-24"
compatibility_flags = ["nodejs_compat"]

# Preview URL větví: https://<alias>-mimonik.knyttl.workers.dev
workers_dev = true
preview_urls = true

# Produkce + preview větví: https://<větev>.mimonik.knyt.tl (wrangler preview)
routes = [
  { pattern = "mimonik.knyt.tl", custom_domain = true, previews_enabled = true }
]

[observability]
enabled = true

[assets]
directory = "html"
