name = "mimonik"
compatibility_date = "2026-04-24"
compatibility_flags = ["nodejs_compat"]

# Preview URL větví: https://<alias>-mimonik.knyttl.workers.dev
workers_dev = true
preview_urls = true

# Preview doména (v UI: Custom domain, type = Preview): <alias>.mimonik-test.knyt.tl
routes = [
  { pattern = "mimonik-test.knyt.tl", custom_domain = true, enabled = false, previews_enabled = true }
]

[observability]
enabled = true

[assets]
directory = "html"
