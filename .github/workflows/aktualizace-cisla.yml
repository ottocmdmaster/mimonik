name: Aktualizace čísla Mimoníku

on:
  push:
    branches: [main]
    paths:
      - "html/images/pdf/*.pdf"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aktualizuj:
    runs-on: ubuntu-latest
    steps:
      - name: Stáhni repozitář
        uses: actions/checkout@v4

      - name: Nainstaluj poppler-utils (pdftoppm)
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Spusť aktualizuj.sh
        run: ./aktualizuj.sh

      - name: Commitni vygenerované stránky
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add html/images/strany html/cisla.json
          if git diff --cached --quiet; then
            echo "Žádné nové stránky k commitnutí."
          else
            git commit -m "Automatická aktualizace stránek časopisu"
            git push
          fi

      - name: Upozornit odběratele na nové číslo
        if: github.event_name == 'push' && success()
        env:
          NOTIFY_TOKEN: ${{ secrets.NOTIFY_TOKEN }}
        run: |
          if git diff --name-only --diff-filter=A "${{ github.event.before }}" "${{ github.sha }}" -- 'html/images/pdf/*.pdf' | grep -q .; then
            curl -fsS -X POST "https://mimonik.knyt.tl/api/push/notify" -H "Authorization: Bearer $NOTIFY_TOKEN"
          else
            echo "Žádné nové PDF, upozornění se neposílá."
          fi

      - name: Upozornění na selhání (e-mail)
        if: failure()
        run: |
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          BODY=$(jq -n --arg zprava "Automatické zpracování PDF čísla Mimoníku selhalo. Zkontroluj, že název souboru odpovídá konvenci MMRR.pdf nebo MM+MMRR.pdf. Detail běhu: $RUN_URL" '{_subject: "Aktualizace čísla Mimoníku selhala", zprava: $zprava}')
          curl -s -X POST "https://formsubmit.co/ajax/mimonik4b@gmail.com" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            -d "$BODY"
