name: Aktualizace čísla Mimoníku

on:
  push:
    branches: [main]
    paths:
      - "html/images/pdf/*.pdf"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aktualizuj:
    runs-on: ubuntu-latest
    steps:
      - name: Stáhni repozitář
        uses: actions/checkout@v4

      - name: Nainstaluj poppler-utils (pdftoppm)
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Spusť aktualizuj.sh
        run: ./aktualizuj.sh

      - name: Commitni vygenerované stránky
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add html/images/strany
          if git diff --cached --quiet; then
            echo "Žádné nové stránky k commitnutí."
          else
            git commit -m "Automatická aktualizace stránek časopisu"
            git push
          fi

      - name: Upozornění na selhání (e-mail)
        if: failure()
        run: |
          BODY=$(python3 -c "
import json, os

run_url = f\"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}\"
zprava = (
    'Automatické zpracování PDF čísla Mimoníku selhalo. '
    'Zkontroluj, že název souboru odpovídá konvenci MMRR.pdf nebo MM+MMRR.pdf. '
    f'Detail běhu: {run_url}'
)
print(json.dumps({
    '_subject': 'Aktualizace čísla Mimoníku selhala',
    'zprava': zprava,
}))
")
          curl -s -X POST "https://formsubmit.co/ajax/mimonik4b@gmail.com" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            -d "$BODY"
